<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1260" width="900" height="1260" role="img" aria-labelledby="title desc">
  <title id="title">iSay 語音輸入流程</title>
  <desc id="desc">按住右 Command 錄音，放開後在本機辨識、轉成台灣正體中文並整理，最後輸入回原本的輸入框。</desc>
  <defs>
    <style>
      text { font-family: 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; fill: #1f2937; }
      .main { font-size: 15px; font-weight: 600; }
      .sub { font-size: 12.5px; fill: #4b5563; }
      .side { font-size: 13px; }
      .section { font-size: 14px; font-weight: 700; fill: #334155; }
      .label { font-size: 13px; font-weight: 600; fill: #475569; }
      .box { fill: #ffffff; stroke: #4a6fa5; stroke-width: 1.5; }
      .key { fill: #e8f0fb; stroke: #4a6fa5; stroke-width: 1.5; }
      .alt { fill: #fff7e6; stroke: #d4a017; stroke-width: 1.3; }
      .done { fill: #e9f7ef; stroke: #2f855a; stroke-width: 1.5; }
      .bg { fill: #f5f7fb; stroke: #d0d7e2; stroke-width: 1; }
      .arrow { fill: none; stroke: #4a5568; stroke-width: 1.5; marker-end: url(#head); }
      .dash { fill: none; stroke: #b7791f; stroke-width: 1.3; stroke-dasharray: 4 3; }
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect width="900" height="1260" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" style="font-size:20px;font-weight:700">iSay 語音輸入流程</text>

  <!-- 1 錄音 -->
  <rect class="bg" x="10" y="54" width="880" height="226" rx="12"/>
  <text class="section" x="24" y="76">1　錄音</text>

  <rect class="key" x="290" y="80" width="320" height="40" rx="8"/>
  <text class="main" x="450" y="105" text-anchor="middle">按住右 ⌘</text>

  <rect class="alt" x="680" y="72" width="200" height="56" rx="8"/>
  <text class="side" x="780" y="96" text-anchor="middle">左 ⌘、組合鍵、密碼欄</text>
  <text class="side" x="780" y="116" text-anchor="middle">不會開始錄音</text>
  <path class="dash" d="M610 100 H680"/>

  <path class="arrow" d="M450 120 V140"/>
  <rect class="box" x="230" y="142" width="440" height="56" rx="8"/>
  <text class="main" x="450" y="165" text-anchor="middle">記下原本的輸入框，開始錄音</text>
  <text class="sub" x="450" y="186" text-anchor="middle">16 kHz 錄音存在暫存資料夾 isay-&lt;UUID&gt;，滑鼠旁顯示狀態</text>

  <rect class="alt" x="20" y="148" width="190" height="44" rx="8"/>
  <text class="side" x="115" y="175" text-anchor="middle">按 Esc：取消並刪除錄音</text>
  <path class="arrow" d="M230 170 H212"/>

  <rect class="alt" x="690" y="148" width="190" height="44" rx="8"/>
  <text class="side" x="785" y="175" text-anchor="middle">滿 60 秒：自動送去辨識</text>
  <path class="arrow" d="M670 170 H688"/>

  <path class="arrow" d="M450 198 V222"/>
  <rect class="key" x="290" y="224" width="320" height="40" rx="8"/>
  <text class="main" x="450" y="249" text-anchor="middle">放開右 ⌘</text>

  <!-- 2 辨識 -->
  <rect class="bg" x="10" y="296" width="880" height="514" rx="12"/>
  <text class="section" x="24" y="318">2　辨識（全部在這台 Mac 上完成）</text>

  <path class="arrow" d="M450 264 V328"/>
  <rect class="box" x="230" y="330" width="440" height="40" rx="8"/>
  <text class="main" x="450" y="355" text-anchor="middle">讀取詞庫 ~/.config/isay/詞庫.txt</text>

  <path class="arrow" d="M450 370 V390"/>
  <rect class="box" x="230" y="392" width="440" height="56" rx="8"/>
  <text class="main" x="450" y="415" text-anchor="middle">isay-prompt 依 Whisper 分詞器挑提示詞</text>
  <text class="sub" x="450" y="436" text-anchor="middle">從最前面挑到約 220 token 為止；無法計算時改用保守估計</text>

  <path class="arrow" d="M450 448 V468"/>
  <rect class="box" x="230" y="470" width="440" height="56" rx="8"/>
  <text class="main" x="450" y="493" text-anchor="middle">whisper-cli：Whisper Large v3 Turbo＋Silero VAD</text>
  <text class="sub" x="450" y="514" text-anchor="middle">中文辨識（可夾雜英文），最多等 30 秒</text>

  <path class="arrow" d="M450 526 V546"/>
  <rect class="box" x="230" y="548" width="440" height="56" rx="8"/>
  <text class="main" x="450" y="571" text-anchor="middle">OpenCC：轉成台灣正體中文</text>
  <text class="sub" x="450" y="592" text-anchor="middle">最多等 5 秒</text>

  <path class="arrow" d="M450 604 V624"/>
  <rect class="box" x="230" y="626" width="440" height="40" rx="8"/>
  <text class="main" x="450" y="651" text-anchor="middle">套用詞庫替換規則（原詞 =&gt; 正確寫法）</text>

  <path class="arrow" d="M450 666 V686"/>
  <rect class="box" x="230" y="688" width="440" height="40" rx="8"/>
  <text class="main" x="450" y="713" text-anchor="middle">整理中文標點</text>

  <path class="arrow" d="M450 728 V748"/>
  <rect class="box" x="230" y="750" width="440" height="40" rx="8"/>
  <text class="main" x="450" y="775" text-anchor="middle">刪除暫存的錄音與逐字稿</text>

  <rect class="alt" x="690" y="478" width="190" height="40" rx="8"/>
  <text class="side" x="785" y="503" text-anchor="middle">逾時：顯示原因，可重錄</text>
  <path class="dash" d="M670 498 H690"/>
  <path class="arrow" d="M785 192 V350 H672"/>

  <!-- 3 輸入 -->
  <rect class="bg" x="10" y="826" width="880" height="384" rx="12"/>
  <text class="section" x="24" y="848">3　輸入</text>

  <rect class="alt" x="20" y="852" width="250" height="52" rx="8"/>
  <text class="side" x="145" y="874" text-anchor="middle">錄滿 60 秒時若右 ⌘ 還按著，</text>
  <text class="side" x="145" y="894" text-anchor="middle">辨識完先等放開才輸入</text>
  <path class="dash" d="M270 878 H290"/>

  <path class="arrow" d="M450 790 V852"/>
  <rect class="key" x="290" y="854" width="320" height="48" rx="24"/>
  <text class="main" x="450" y="883" text-anchor="middle">焦點還在原本的輸入框？</text>

  <path class="arrow" d="M610 878 H688"/>
  <text class="label" x="650" y="870" text-anchor="middle">否</text>

  <text class="label" x="462" y="918">是</text>
  <path class="arrow" d="M450 902 V922"/>
  <rect class="box" x="230" y="924" width="440" height="96" rx="8"/>
  <text class="main" x="450" y="948" text-anchor="middle">選擇輸入方式</text>
  <text class="sub" x="450" y="970" text-anchor="middle">一般 App：用 macOS 輔助使用 API 直接寫入</text>
  <text class="sub" x="450" y="990" text-anchor="middle">ChatGPT、Slack、Herdr，以及無法直接寫入的欄位：</text>
  <text class="sub" x="450" y="1008" text-anchor="middle">用 Unicode 鍵盤事件打字</text>

  <path class="arrow" d="M450 1020 V1040"/>
  <rect class="key" x="290" y="1042" width="320" height="48" rx="24"/>
  <text class="main" x="450" y="1071" text-anchor="middle">成功輸入？</text>

  <path class="arrow" d="M610 1066 H688"/>
  <text class="label" x="650" y="1058" text-anchor="middle">否</text>

  <rect class="alt" x="690" y="852" width="190" height="238" rx="8"/>
  <text class="main" x="785" y="904" text-anchor="middle">不自動輸入</text>
  <text class="side" x="785" y="934" text-anchor="middle">焦點已改變、寫入失敗、</text>
  <text class="side" x="785" y="954" text-anchor="middle">辨識期間有其他操作、</text>
  <text class="side" x="785" y="974" text-anchor="middle">不是文字欄位，</text>
  <text class="side" x="785" y="994" text-anchor="middle">或無法確認是否已輸入</text>
  <text class="side" x="785" y="1034" text-anchor="middle">選單顯示原因，可用</text>
  <text class="side" x="785" y="1054" text-anchor="middle">「複製上次辨識文字」</text>

  <text class="label" x="462" y="1104">是</text>
  <path class="arrow" d="M450 1090 V1112"/>
  <rect class="done" x="230" y="1114" width="440" height="60" rx="8"/>
  <text class="main" x="450" y="1138" text-anchor="middle">文字出現在原本的輸入框</text>
  <text class="sub" x="450" y="1160" text-anchor="middle">不按 Enter、不動剪貼簿</text>

  <text class="sub" x="450" y="1240" text-anchor="middle">iSay 本身不連網；錄音、辨識、轉換都在本機進行。</text>
</svg>
